plugins {
	// A partir de 26.1, Loom expone un plugin id nuevo para versiones NO
	// ofuscadas de Minecraft: "net.fabricmc.fabric-loom". El id antiguo
	// "fabric-loom" se mantiene solo por compatibilidad con versiones
	// ofuscadas (1.21.11 e inferiores) y con este mod ya no aplica.
	id 'net.fabricmc.fabric-loom' version "${project.loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Añade aquí repos adicionales si necesitas alguna librería extra.
}

loom {
	// Sin configuración especial: mod puramente client-side.
}

dependencies {
	// Minecraft 26.1+ ya no está ofuscado, así que Loom no necesita (ni
	// acepta) una dependencia "mappings": el propio artefacto de Mojang
	// trae los nombres reales de clases/métodos/campos.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Loader y Fabric API. IMPORTANTE: en 26.1+ las dependencias de mods
	// ya NO se remapean (el juego no está ofuscado), así que se usan las
	// configuraciones estándar de Gradle ("implementation") en vez de las
	// variantes "mod*" ("modImplementation", "modApi", etc.), que quedan
	// reservadas para versiones ofuscadas de Minecraft.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

java {
	withSourcesJar()
	// Minecraft 26.1+ requiere Java 25.
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

// En 26.1+ ya no existe un jar "intermedio" que haya que remapear a
// nombres oficiales (el juego ya usa nombres oficiales): la tarea
// "remapJar" desaparece y el jar final se produce directamente con "jar".
jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
