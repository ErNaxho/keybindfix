# Ajustes de Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IMPORTANTE: Gradle debe ejecutarse sobre un JDK 21 (Fabric/Loom para
# 1.21.11 no está pensado para Java 25). Ajusta esta ruta a tu instalación
# real de JDK 21 (usa Get-ChildItem "C:\Program Files\Eclipse Adoptium" en
# PowerShell para ver el nombre exacto de la carpeta). Usa siempre barras
# normales "/", aunque sea una ruta de Windows.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot


# Versiones de Minecraft / mapeos / loader
# NOTA: verifica siempre las últimas versiones disponibles en
# https://fabricmc.net/develop antes de compilar, por si hay un build
# de Yarn o Fabric API más reciente para 1.21.11.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.4

# Fabric API
fabric_version=0.141.6+1.21.11

# Datos del mod
mod_version=1.0.0
maven_group=xyz.naxho
archives_base_name=keybindfix
