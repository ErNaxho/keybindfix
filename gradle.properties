# Ajustes de Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IMPORTANTE: a partir de Minecraft 26.1 el toolchain requiere JDK 25
# (Loom/Mixin de esta generación ya soportan 25 oficialmente). Ajusta esta
# ruta a tu instalación real de JDK 25 (usa
# Get-ChildItem "C:\Program Files\Eclipse Adoptium" en PowerShell para ver
# el nombre exacto de la carpeta). Usa siempre barras normales "/", aunque
# sea una ruta de Windows.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-25.0.1-hotspot

# NOTA (Configuration Cache): el equipo de Fabric recomienda desactivarlo
# de momento en 26.x porque IntelliJ IDEA todavía no es 100% compatible
# con él (ver https://github.com/FabricMC/fabric-loom/issues/1349).
org.gradle.configuration-cache=false

# Versiones de Minecraft / Loader / Loom
# NOTA: Minecraft 26.1+ ya NO usa Yarn (mappings "named"): usa las
# mappings oficiales de Mojang directamente, porque el juego dejó de
# estar ofuscado. Por eso ya no existe una propiedad "yarn_mappings" ni
# una dependencia "mappings" en build.gradle.
# Verifica siempre las últimas versiones disponibles en
# https://fabricmc.net/develop antes de compilar.
#
# Este proyecto compila contra 26.2 (la última estable). Al no usar
# ninguna API de renderizado (OpenGL/Vulkan) ni ninguna clase que haya
# cambiado entre 26.1.2 y 26.2, el mismo .jar es compatible con ambas
# versiones (ver README para el detalle y cómo generar un build
# específico para 26.1.2 si lo prefieres).
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.16.2

# Fabric API
fabric_version=0.152.2+26.2

# Datos del mod
mod_version=1.0.0
maven_group=xyz.naxho
archives_base_name=keybindfix
